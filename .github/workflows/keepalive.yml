name: Mantener activo el proyecto (keep-alive)
# Los proyectos gratuitos de Supabase se pausan tras una semana sin actividad.
# Esta llamada diaria a /api/health ejecuta una consulta mínima y lo evita.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "Falta la variable SITE_URL (Settings → Secrets and variables → Actions → Variables)"; exit 1; }
          curl -fsS --retry 3 --retry-delay 10 "$SITE_URL/api/health"
